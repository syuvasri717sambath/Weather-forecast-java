
<!-- Chart.js Initialization Script -->
<script th:if="${data != null and data.forecast != null}"
        th:inline="javascript">
    /*<![CDATA[*/

    const forecastDates = /*[[${data.forecast.![date]}]]*/ [];
    const maxTemps = /*[[${data.forecast.![maxTemp]}]]*/ [];
    const minTemps = /*[[${data.forecast.![minTemp]}]]*/ [];

    const canvas = document.getElementById('tempChart');

    if (canvas) {
        const ctx = canvas.getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: forecastDates,
                datasets: [
                    {
                        label: 'Max Temp (°C)',
                        data: maxTemps,
                        borderColor: '#ff6384',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Min Temp (°C)',
                        data: minTemps,
                        borderColor: '#36a2eb',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: '#ffffff' }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#adb5bd' },
                        grid: { color: '#495057' }
                    },
                    y: {
                        ticks: { color: '#adb5bd' },
                        grid: { color: '#495057' }
                    }
                }
            }
        });
    }

    /*]]>*/
</script>
