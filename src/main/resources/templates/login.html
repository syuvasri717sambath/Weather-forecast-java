<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="card bg-secondary text-white p-4 shadow-lg" style="width: 380px;">
    <h4 class="text-center mb-3">🔐 Admin Login</h4>
    <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="admin" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="admin123" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold">Login</button>
    </form>
    <a href="/" class="btn btn-link text-light mt-2">← Back to Home</a>
</div>
</body>
</html>
