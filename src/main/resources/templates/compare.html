<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>City vs City Weather Comparison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="/">🌦️ WeatherCast Java</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Current Weather</a>
            <a class="nav-link" href="/forecast">7-Day Forecast</a>
            <a class="nav-link active" href="/compare">Compare Cities</a>
            <a class="nav-link" href="/history">Search History</a>
            <a class="nav-link text-warning" href="/admin">Admin Panel</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="text-center mb-4">⚔️ City vs City Weather Comparison</h2>
    
    <!-- Comparison Form -->
    <form action="/compare" method="get" class="row g-3 justify-content-center mb-5">
        <div class="col-md-4">
            <input type="text" name="city1" class="form-control form-control-lg" placeholder="First City (e.g., Chennai)" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="city2" class="form-control form-control-lg" placeholder="Second City (e.g., London)" required>
        </div>
        <div class="col-md-auto">
            <button type="submit" class="btn btn-info btn-lg fw-bold px-4">Compare</button>
        </div>
    </form>

    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

    <!-- Comparison Results Side-by-Side -->
    <div class="row g-4" th:if="${w1} and ${w2}">
        <!-- City 1 Card -->
        <div class="col-md-6">
            <div class="card bg-secondary text-white shadow-lg border-0 h-100">
                <div class="card-body p-4 text-center">
                    <h3 class="fw-bold text-info"><span th:text="${w1.city}"></span>, <span th:text="${w1.country}"></span></h3>
                    <h1 class="display-3 fw-bold my-3"><span th:text="${w1.temperature}"></span> °C</h1>
                    <p class="fs-5 text-uppercase badge bg-dark px-3 py-2" th:text="${w1.description}"></p>
                    <hr class="border-light">
                    <div class="row mt-3">
                        <div class="col-6">
                            <h5>💧 Humidity</h5>
                            <p class="fs-5"><span th:text="${w1.humidity}"></span>%</p>
                        </div>
                        <div class="col-6">
                            <h5>💨 Wind Speed</h5>
                            <p class="fs-5"><span th:text="${w1.windSpeed}"></span> km/h</p>
                        </div>
                    </div>
                    <div class="alert alert-info mt-4 text-start shadow-sm border-0 bg-dark text-info" role="alert">
                        <h5 class="alert-heading fw-bold">💡 AI Recommendation</h5>
                        <p class="mb-0 fs-6 text-light" th:text="${rec1}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- City 2 Card -->
        <div class="col-md-6">
            <div class="card bg-secondary text-white shadow-lg border-0 h-100">
                <div class="card-body p-4 text-center">
                    <h3 class="fw-bold text-warning"><span th:text="${w2.city}"></span>, <span th:text="${w2.country}"></span></h3>
                    <h1 class="display-3 fw-bold my-3"><span th:text="${w2.temperature}"></span> °C</h1>
                    <p class="fs-5 text-uppercase badge bg-dark px-3 py-2" th:text="${w2.description}"></p>
                    <hr class="border-light">
                    <div class="row mt-3">
                        <div class="col-6">
                            <h5>💧 Humidity</h5>
                            <p class="fs-5"><span th:text="${w2.humidity}"></span>%</p>
                        </div>
                        <div class="col-6">
                            <h5>💨 Wind Speed</h5>
                            <p class="fs-5"><span th:text="${w2.windSpeed}"></span> km/h</p>
                        </div>
                    </div>
                    <div class="alert alert-warning mt-4 text-start shadow-sm border-0 bg-dark text-warning" role="alert">
                        <h5 class="alert-heading fw-bold">💡 AI Recommendation</h5>
                        <p class="mb-0 fs-6 text-light" th:text="${rec2}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
