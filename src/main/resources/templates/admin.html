<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="/admin">⚙️ Admin Management Dashboard</a>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-info btn-sm">View Site</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Manage Search Logs (<span th:text="${#lists.size(records)}"></span>)</h3>
        <form th:action="@{/admin/clear}" method="post">
            <button type="submit" class="btn btn-danger">🗑️ Clear All History</button>
        </form>
    </div>

    <table class="table table-dark table-bordered align-middle">
        <thead>
            <tr>
                <th>ID</th>
                <th>City</th>
                <th>Temp (°C)</th>
                <th>Condition</th>
                <th>Searched At</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.city}"></td>
                <td th:text="${r.temperature}"></td>
                <td th:text="${r.description}"></td>
                <td th:text="${r.searchedAt}"></td>
                <td>
                    <form th:action="@{/admin/delete/{id}(id=${r.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
