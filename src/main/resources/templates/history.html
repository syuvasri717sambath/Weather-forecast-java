<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="/">🌦️ WeatherCast Java</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Current Weather</a>
            <a class="nav-link" href="/forecast">7-Day Forecast</a>
            <a class="nav-link active" href="/history">Search History</a>
            <a class="nav-link text-warning" href="/admin">Admin Panel</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h3 class="mb-4">Recent Weather Searches</h3>
    <table class="table table-dark table-striped table-hover align-middle">
        <thead>
            <tr>
                <th>#</th>
                <th>City</th>
                <th>Country</th>
                <th>Temp (°C)</th>
                <th>Humidity (%)</th>
                <th>Wind (km/h)</th>
                <th>Condition</th>
                <th>Searched At</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${r.id}"></td>
                <td class="fw-bold text-info" th:text="${r.city}"></td>
                <td th:text="${r.country}"></td>
                <td th:text="${r.temperature}"></td>
                <td th:text="${r.humidity}"></td>
                <td th:text="${r.windSpeed}"></td>
                <td th:text="${r.description}"></td>
                <td th:text="${r.searchedAt}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
